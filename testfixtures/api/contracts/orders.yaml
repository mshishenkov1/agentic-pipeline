openapi: 3.0.0
info: {title: Orders, version: 1.2.0}
paths:
  /orders:
    post:
      requestBody:
        content:
          application/json:
            schema: {type: object, required: [item], properties: {item: {type: string}}}
      responses:
        '201': {content: {application/json: {schema: {type: object, properties: {id: {type: string}, total: {type: number}, note: {type: string}}}}}}
        '409': {description: duplicate}
  /orders/{id}:
    get:
      responses:
        '200': {description: ok}

# Независимая проверка тех же quality gates на стороне CI (ТЗ §6.6):
# агент мог ошибиться локально, CI перепроверяет.
#
# Две джобы:
#   design   — гейты уровня проекта (G7–G13). Условные: без артефактов
#              дизайна печатают «неприменим» и не блокируют.
#   services — матрица по затронутым сервисам. В плоском режиме (topology: flat)
#              матрица пуста, и весь прогон делает джоба design.
name: pipeline-gates

on:
  pull_request:
  push:
    branches:
      - "pipeline/**"
      - "design/**"

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
      flat: ${{ steps.detect.outputs.flat }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Затронутые сервисы
        id: detect
        run: |
          python -m pip install --quiet pyyaml
          SERVICES=$(python scripts/changed_services.py --json)
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"
          if [ "$SERVICES" = "[]" ]; then
            echo "flat=true" >> "$GITHUB_OUTPUT"
          else
            echo "flat=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Матрица сервисов: $SERVICES"

  # Гейты уровня проекта: требования, архитектура, диаграммы, нагрузка,
  # миграции, инфраструктура, контракты. Плюс полный прогон в плоском режиме.
  design:
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Кэш зависимостей
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Установка зависимостей
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"

      - name: Гейты
        run: .venv/bin/python scripts/run_gates.py --run-id "ci-${{ github.run_number }}" --ci

      - name: Артефакты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gates-design
          path: |
            reports/gates-*.json
            reports/coverage.xml
          if-no-files-found: ignore

  # Матрица по сервисам: каждый проверяется своими командами и в своей области.
  services:
    needs: detect
    if: needs.detect.outputs.flat == 'false'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей конвейера
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"

      # Область прогона задаётся тем же механизмом, что и локально, —
      # гейты и зоны сужаются до одного сервиса.
      - name: Область работы = ${{ matrix.service }}
        run: .venv/bin/python scripts/state.py scope ${{ matrix.service }}

      - name: Гейты сервиса
        run: |
          .venv/bin/python scripts/run_gates.py \
            --run-id "ci-${{ github.run_number }}-${{ matrix.service }}" --ci

      - name: Артефакты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gates-${{ matrix.service }}
          path: reports/gates-*.json
          if-no-files-found: ignore
